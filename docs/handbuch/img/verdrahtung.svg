<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Verdrahtungsuebersicht Shelly Plus Uni">
  <rect x="0" y="0" width="920" height="560" fill="#f6f8f4"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#14532d">Verdrahtung — Übersicht (Blockschema)</text>
  <text x="24" y="56" font-size="13" fill="#4b5563">Vereinfacht. Der vollständige Plan mit Aderfarben steht in hardware/verdrahtung.md.</text>

  <!-- Shelly center -->
  <rect x="360" y="120" width="200" height="330" rx="12" fill="#ffffff" stroke="#14532d" stroke-width="2"/>
  <text x="460" y="146" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Shelly Plus Uni</text>

  <!-- left terminals (power) -->
  <g font-size="12" fill="#111827">
    <rect x="360" y="170" width="90" height="26" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="366" y="187">VAC1 (+12V)</text>
    <rect x="360" y="204" width="90" height="26" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="366" y="221">VAC2 (−)</text>
    <rect x="360" y="238" width="90" height="26" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="366" y="255">GND</text>
  </g>
  <!-- right terminals (io) -->
  <g font-size="12" fill="#111827" text-anchor="end">
    <rect x="470" y="170" width="90" height="26" rx="5" fill="#ecfdf5" stroke="#3a7d44"/>
    <text x="554" y="187">ANALOG IN</text>
    <rect x="470" y="204" width="90" height="26" rx="5" fill="#ecfdf5" stroke="#3a7d44"/>
    <text x="554" y="221">SENSOR VCC</text>
    <rect x="470" y="238" width="90" height="26" rx="5" fill="#ecfdf5" stroke="#3a7d44"/>
    <text x="554" y="255">DATA</text>
    <rect x="470" y="272" width="90" height="26" rx="5" fill="#eff6ff" stroke="#2563eb"/>
    <text x="554" y="289">IN2 (input:1)</text>
    <rect x="470" y="330" width="90" height="26" rx="5" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="554" y="347">OUT1 (switch:0)</text>
  </g>

  <!-- PSU left -->
  <rect x="40" y="180" width="150" height="70" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="52" y="204" font-size="13" font-weight="600" fill="#991b1b">Netzteil 12 V DC</text>
  <text x="52" y="222" font-size="11" fill="#6b7280">≥ 1 A</text>
  <text x="52" y="240" font-size="11" fill="#6b7280">+ → VAC1 · − → VAC2/GND</text>

  <!-- SMT50 -->
  <rect x="600" y="150" width="150" height="56" rx="8" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="612" y="172" font-size="13" font-weight="600" fill="#14532d">SMT50</text>
  <text x="612" y="190" font-size="11" fill="#6b7280">Signal→ANALOG IN, +12V, GND</text>

  <!-- DS18B20 -->
  <rect x="600" y="214" width="150" height="56" rx="8" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="612" y="236" font-size="13" font-weight="600" fill="#14532d">DS18B20</text>
  <text x="612" y="254" font-size="11" fill="#6b7280">VCC · DATA · GND</text>

  <!-- Float -->
  <rect x="600" y="278" width="150" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="612" y="300" font-size="13" font-weight="600" fill="#1d4ed8">Schwimmer</text>
  <text x="612" y="316" font-size="11" fill="#6b7280">IN2 ↔ GND</text>

  <!-- Relay + pump -->
  <rect x="600" y="336" width="150" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="612" y="358" font-size="13" font-weight="600" fill="#5b21b6">Relais (Spule)</text>
  <text x="612" y="374" font-size="11" fill="#6b7280">OUT1 · max 30 V / 300 mA</text>

  <rect x="600" y="398" width="150" height="52" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="612" y="420" font-size="13" font-weight="600" fill="#991b1b">Pumpe (230 V)</text>
  <text x="612" y="437" font-size="11" fill="#6b7280">über Relaiskontakt · Fachkraft!</text>

  <!-- connections -->
  <g stroke="#4b5563" stroke-width="1.6" fill="none">
    <path d="M190 200 L360 183"/>
    <path d="M190 235 L360 217"/>
    <path d="M600 178 L560 183"/>
    <path d="M600 236 L560 217"/>
    <path d="M600 250 L560 251"/>
    <path d="M600 300 L560 285"/>
    <path d="M600 358 L560 343"/>
    <path d="M675 380 L675 398"/>
  </g>

  <text x="24" y="500" font-size="12" fill="#b91c1c" font-weight="600">⚠ Arbeiten an 230 V nur durch eine Elektrofachkraft. Shelly, Relais und Netzteil trocken und im Gehäuse.</text>
  <text x="24" y="522" font-size="11" fill="#6b7280">Schwimmer oberhalb des Pumpeneinlaufs montieren (kein Trockenlauf). Dreifache Pumpen-Abschaltung: toggle_after, auto_off, Sicherheits-Aus.</text>
</svg>
