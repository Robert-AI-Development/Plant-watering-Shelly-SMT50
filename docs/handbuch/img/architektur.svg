<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Architektur der Shelly-Pflanzenbewaesserung">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="540" fill="#f6f8f4"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#14532d">Architektur — läuft lokal auf dem Shelly Plus Uni (ohne Cloud)</text>
  <text x="24" y="56" font-size="13" fill="#4b5563">Drei Einmal-Läufer · ein Zeitplan · ein Gedächtnis (KVS). Nur die Uhrzeit kommt per NTP aus dem Internet.</text>

  <!-- Sensors (left) -->
  <g font-size="13" fill="#111827">
    <rect x="24" y="96" width="170" height="46" rx="8" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="36" y="120" font-weight="600">SMT50 · Bodenfeuchte</text>
    <text x="36" y="136" font-size="11" fill="#6b7280">voltmeter:100</text>

    <rect x="24" y="158" width="170" height="46" rx="8" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="36" y="182" font-weight="600">DS18B20 · Temperatur</text>
    <text x="36" y="198" font-size="11" fill="#6b7280">temperature:100</text>

    <rect x="24" y="220" width="170" height="46" rx="8" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="36" y="244" font-weight="600">Schwimmer · Wasserstand</text>
    <text x="36" y="260" font-size="11" fill="#6b7280">input:1</text>
  </g>

  <!-- Pump (left, bottom) -->
  <rect x="24" y="320" width="170" height="52" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="36" y="344" font-size="13" font-weight="600" fill="#5b21b6">Pumpe (Relais)</text>
  <text x="36" y="361" font-size="11" fill="#6b7280">switch:0 · toggle_after</text>

  <!-- Shelly container -->
  <rect x="250" y="80" width="480" height="360" rx="14" fill="#ffffff" stroke="#14532d" stroke-width="2"/>
  <text x="270" y="106" font-size="15" font-weight="700" fill="#14532d">Shelly Plus Uni</text>

  <!-- Schedule -->
  <rect x="270" y="120" width="200" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="282" y="140" font-size="12" font-weight="700" fill="#92400e">Zeitplan (Schedule)</text>
  <text x="282" y="162" font-size="12" fill="#111827">alle 15 min → bw_main</text>
  <text x="282" y="182" font-size="12" fill="#111827">08:00 &amp; 20:00 → bw_pump</text>
  <text x="282" y="202" font-size="12" fill="#111827">+8 min → Switch aus</text>
  <text x="282" y="220" font-size="11" fill="#6b7280">(Sicherheits-Aus, ohne Script)</text>

  <!-- KVS -->
  <rect x="490" y="120" width="220" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="502" y="140" font-size="12" font-weight="700" fill="#1d4ed8">KVS — Gedächtnis</text>
  <text x="502" y="162" font-size="12" fill="#111827">cfg1 · cfg2 · cfg3 · cfg4 (Einstellungen)</text>
  <text x="502" y="182" font-size="12" fill="#111827">lrn (Lernwerte) · st (Zustand)</text>
  <text x="502" y="202" font-size="12" fill="#111827">job (Auftrag) · day · err</text>
  <text x="502" y="222" font-size="11" fill="#6b7280">50 Einträge, je ≤ 253 Zeichen</text>

  <!-- Scripts -->
  <rect x="270" y="270" width="132" height="150" rx="8" fill="#f0fdf4" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="282" y="292" font-size="13" font-weight="700" fill="#14532d">bw_install</text>
  <text x="282" y="312" font-size="11" fill="#374151">einmalig:</text>
  <text x="282" y="328" font-size="11" fill="#374151">KVS-Startwerte,</text>
  <text x="282" y="344" font-size="11" fill="#374151">Zeitplan,</text>
  <text x="282" y="360" font-size="11" fill="#374151">Switch-Sicherheit</text>

  <rect x="414" y="270" width="132" height="150" rx="8" fill="#f0fdf4" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="426" y="292" font-size="13" font-weight="700" fill="#14532d">bw_main</text>
  <text x="426" y="312" font-size="11" fill="#374151">alle 15 min:</text>
  <text x="426" y="328" font-size="11" fill="#374151">messen, bewerten,</text>
  <text x="426" y="344" font-size="11" fill="#374151">kontrollieren, Pause,</text>
  <text x="426" y="360" font-size="11" fill="#374151">Auftrag schreiben</text>
  <text x="426" y="380" font-size="11" fill="#b91c1c">nie an die Pumpe</text>

  <rect x="558" y="270" width="152" height="150" rx="8" fill="#f0fdf4" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="570" y="292" font-size="13" font-weight="700" fill="#14532d">bw_pump</text>
  <text x="570" y="312" font-size="11" fill="#374151">08:00 / 20:00:</text>
  <text x="570" y="328" font-size="11" fill="#374151">Auftrag prüfen,</text>
  <text x="570" y="344" font-size="11" fill="#374151">Wasserstand,</text>
  <text x="570" y="360" font-size="11" fill="#374151">Pumpe schalten</text>

  <!-- Internet / NTP -->
  <rect x="756" y="120" width="140" height="46" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="768" y="144" font-size="12" font-weight="600" fill="#374151">Internet · NTP</text>
  <text x="768" y="160" font-size="11" fill="#6b7280">nur Uhrzeit</text>

  <!-- Arrows: sensors -> shelly -->
  <g stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M194 119 L250 150"/>
    <path d="M194 181 L250 175"/>
    <path d="M194 243 L250 200"/>
    <!-- bw_pump -> pump -->
    <path d="M558 360 L250 350" marker-end="url(#arr)"/>
    <!-- NTP -> shelly -->
    <path d="M756 143 L730 143"/>
  </g>
  <text x="150" y="90" font-size="11" fill="#6b7280">messen</text>
  <text x="360" y="452" font-size="11" fill="#5b21b6">gießen (mit Selbstabschaltung)</text>

  <!-- KVS internal flow note -->
  <text x="426" y="258" font-size="11" fill="#6b7280">schreibt/liest job, st, lrn … im KVS</text>
</svg>
